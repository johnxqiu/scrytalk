[project]
name = "scryfall-search-skill"
version = "0.1.0"
description = "An Anthropic Skill for natural-language Magic: The Gathering card search via the Scryfall API."
requires-python = ">=3.10"
dependencies = []

# The shipped skill (scripts/scryfall_search.py) uses only the Python standard
# library. The dependencies below are for development only — running the test
# suite — and are never needed to use the skill.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
